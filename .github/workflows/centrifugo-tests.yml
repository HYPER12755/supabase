name: Centrifugo Tests

on:
  pull_request:
    branches: ['master']
    paths:
      - 'docker/volumes/centrifugo/**'
      - 'docker/volumes/logs/**'
      - 'docker/volumes/db/logs.sql'
      - 'docker/tests/test-centrifugo*.sh'
      - 'docker/tests/test-container-logs.sh'
      - 'docker/docker-compose.centrifugo*.yml'
      - 'docker/docker-compose.logs.yml'
      - 'docker/.env.centrifugo.example'
      - 'docker/.env.centrifugo-scale.example'
      - 'docker/utils/generate-centrifugo-keys.sh'
      - 'docker/run.sh'
      - '.github/workflows/centrifugo-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            docker/

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          version=2.4.21
          archive="$RUNNER_TEMP/kotlin-compiler-$version.zip"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/JetBrains/kotlin/releases/download/v$version/kotlin-compiler-$version.zip"
          printf '%s  %s\n' "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd" "$archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Generate keys
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          cp .env.example .env
          sh utils/generate-keys.sh --update-env
          sh utils/add-new-auth-keys.sh --update-env
          sh utils/generate-centrifugo-keys.sh
          sh run.sh config add centrifugo

      - name: Run unit tests and secret generation tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker/volumes/centrifugo/auth
          npm ci --no-audit --no-fund
          npm test
          cd ../outbox
          npm ci --no-audit --no-fund
          npm test
          cd ../../../..
          sh tests/test-centrifugo-secrets.sh

      - name: Run log pipeline tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          sh tests/test-centrifugo-logs.sh

      - name: Start self-hosted Supabase with Centrifugo
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          yq -i '.services.supavisor.environment.RLIMIT_NOFILE=1024' docker-compose.yml
          docker compose -f docker-compose.yml -f docker-compose.centrifugo.yml build centrifugo-auth centrifugo-outbox
          sh run.sh start
          docker compose -f docker-compose.yml -f docker-compose.centrifugo.yml ps

      - name: Run gateway and auth tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          sh tests/test-centrifugo.sh
          sh tests/test-centrifugo-auth.sh

      - name: Run security and SQL helper tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          sh tests/test-centrifugo-security.sh
          sh tests/test-centrifugo-sql.sh

      - name: Run feature and outbox tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          sh tests/test-centrifugo-features.sh
          sh tests/test-centrifugo-outbox.sh

      - name: Run client conformance tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker
          sh tests/test-centrifugo-clients.sh

      - name: Stop stack
        if: always()
        shell: bash
        run: |
          cd docker || exit 0
          sh run.sh stop || true
