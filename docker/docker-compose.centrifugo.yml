# Centrifugo beta overlay. Enable with:
#   sh run.sh config add centrifugo
#
# This overlay is additive. It does not replace or reconfigure Supabase Realtime.
# Gateway routes are implemented in Phase 2. Centrifugo itself publishes no
# host port; only the API gateway exposes the beta paths.

services:
  centrifugo-migrate:
    container_name: supabase-centrifugo-migrate
    profiles: ["centrifugo-migrate"]
    image: supabase/postgres:17.6.1.136
    restart: "no"
    read_only: true
    env_file:
      - .env.centrifugo
    environment:
      PGHOST: "${POSTGRES_HOST}"
      PGPORT: "${POSTGRES_PORT}"
      PGUSER: "supabase_admin"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB}"
    volumes:
      - ./volumes/centrifugo/sql/centrifugo.sql:/sql/centrifugo.sql:ro,z
    command:
      - sh
      - -c
      - |
          set -eu
          : "$${CENTRIFUGO_AUTH_DB_PASSWORD:?CENTRIFUGO_AUTH_DB_PASSWORD is required}"
          : "$${CENTRIFUGO_OUTBOX_DB_PASSWORD:?CENTRIFUGO_OUTBOX_DB_PASSWORD is required}"
          exec psql -v ON_ERROR_STOP=1 -f /sql/centrifugo.sql
    depends_on:
      db:
        condition: service_healthy

  centrifugo-auth:
    container_name: supabase-centrifugo-auth
    image: supabase/centrifugo-auth:0.1.0
    build:
      context: ./volumes/centrifugo/auth
    restart: unless-stopped
    read_only: true
    env_file:
      - .env.centrifugo
    environment:
      PORT: "8090"
      CENTRIFUGO_AUTH_ALLOWED_ORIGINS: "${SITE_URL} ${SUPABASE_PUBLIC_URL}"
      CENTRIFUGO_AUTH_TRUST_PROXY: "true"
      SUPABASE_JWKS_URL: "http://auth:9999/.well-known/jwks.json"
      SUPABASE_JWT_ISSUERS: "${API_EXTERNAL_URL} supabase"
      SUPABASE_JWT_AUD: "authenticated"
      SUPABASE_JWT_SECRET: "${JWT_SECRET:-}"
      SUPABASE_ANON_KEY: "${ANON_KEY:-}"
      SUPABASE_ANON_KEY_ASYMMETRIC: "${ANON_KEY_ASYMMETRIC:-}"
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SERVICE_ROLE_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY_ASYMMETRIC: "${SERVICE_ROLE_KEY_ASYMMETRIC:-}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:-}"
      CENTRIFUGO_AUTH_TOKEN_TTL_SECONDS: "900"
      CENTRIFUGO_AUTHZ_CACHE_TTL_SECONDS: "5"
      CENTRIFUGO_AUTHZ_CACHE_VERSION: "1"
      CENTRIFUGO_AUTH_TOKEN_KEY_ID: "phase3"
    depends_on:
      auth:
        condition: service_healthy
    expose:
      - "8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get({host:'127.0.0.1',port:8090,path:'/health'},(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

  centrifugo:
    container_name: supabase-centrifugo
    image: centrifugo/centrifugo:v6.10.2
    restart: unless-stopped
    depends_on:
      centrifugo-auth:
        condition: service_healthy
    env_file:
      - .env.centrifugo
    environment:
      # Derive allowed browser origins from the deployment's own URLs. Do not
      # commit environment-specific origins here.
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "${SITE_URL} ${SUPABASE_PUBLIC_URL}"
    volumes:
      - ./volumes/centrifugo/config.json:/centrifugo/config.json:ro,z
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z 127.0.0.1 8000"
        ]
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s

  centrifugo-outbox:
    container_name: supabase-centrifugo-outbox
    image: supabase/centrifugo-outbox:0.1.0
    build:
      context: ./volumes/centrifugo/outbox
    restart: unless-stopped
    read_only: true
    stop_grace_period: 20s
    env_file:
      - .env.centrifugo
    environment:
      CENTRIFUGO_HTTP_API_URL: "http://centrifugo:8000"
      CENTRIFUGO_OUTBOX_ORDERING_MODE: "strict"
      CENTRIFUGO_OUTBOX_PARTITION_COUNT: "1"
      CENTRIFUGO_OUTBOX_PARTITION_INDEX: "0"
      CENTRIFUGO_OUTBOX_METRICS_PORT: "9100"
    depends_on:
      centrifugo:
        condition: service_healthy
    expose:
      - "9100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get({host:'127.0.0.1',port:9100,path:'/health'},(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s
